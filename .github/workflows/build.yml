name: Build app packages

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: flutter analyze --no-pub --no-fatal-infos lib test integration_test test_driver
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: flutter test --no-pub --dart-define=DISABLE_REMOTE_IMAGES=true
      - run: flutter test --no-pub --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true
      - run: go test -race ./...
        working-directory: native
      - run: go test -race -ldflags="-X duanjuapp/native/core.buildAllSources=true" ./...
        working-directory: native

  android:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36"
          accept-android-sdk-licenses: true
      - run: sdkmanager 'ndk;28.2.13676358'
      - name: Configure Android signing
        id: signing
        run: |
          python scripts/configure_signing.py
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: python scripts/build_android.py ${{ matrix.arguments }}
      - name: 校验 APK 签名证书
        shell: bash
        run: |
          set -euo pipefail
          expected='55c3c3395a00e56e99b8bfd580b14c99618da74db19692a2e42606eb05c47ba9'
          apksigner=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -n1)
          test -n "$apksigner"
          for apk in dist/android/*.apk; do
            output=$("$apksigner" verify --verbose --print-certs "$apk")
            printf '%s\n' "$output"
            printf '%s\n' "$output" | grep -Fxq 'Number of signers: 1'
          actual=$(printf '%s\n' "$output" | sed -En 's/^(Signer #[0-9]+|V[0-9]+([.][0-9]+)? Signer):? certificate SHA-256 digest: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]' | sort -u)
            test "$actual" = "$expected"
          done
      - name: Remove signing files
        if: always()
        run: python scripts/configure_signing.py --clean
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-android
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14
  windows:
    if: false
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4

  ios:
    if: false
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4

  release:
    needs: [checks, android]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 生成发布文件清单
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          mkdir -p release
          for directory in artifacts/*/; do
            for file in "$directory"*; do
              [ -f "$file" ] || continue
              name=$(basename "$file")
              if [ "$name" = "SHA256SUMS.txt" ]; then
                continue
              fi
              cp "$file" "release/$name"
            done
          done
          cd release
          mapfile -t files < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)
          tag="app-v${version//+/-}"
          {
            printf '%s\n\n' "版本 ${version}。两个版本功能相同，区别只在站源范围，按需选择："
            printf '%s\n' "- 红果鉴 hongguojian：仅红果站源"
            printf '%s\n' "- 真果鉴 zhenguojian：全部站源"
            printf '\n%s\n' "Android（固定正式证书签名，可覆盖 0.1.0 / 0.1.1，未做真实手机 / TV 验收）："
            printf '%s\n' "- *-arm64-v8a.apk：绝大多数手机选这个"
            printf '%s\n' "- *-armeabi-v7a.apk：较老的 32 位手机"
            printf '%s\n' "- *-x86_64.apk：模拟器"
            printf '\n%s\n' "源码提交：${{ github.sha }}"
            printf '%s\n' "校验：SHA256SUMS.txt"
            printf '%s\n' "签名证书 SHA-256：55c3c3395a00e56e99b8bfd580b14c99618da74db19692a2e42606eb05c47ba9"
          } > notes.md
          if [[ "$version" == *-* ]]; then
            echo "开发快照不能作为最终正式版发布。" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "版本已存在；请递增版本后发布，禁止覆盖既有发布文件。" >&2
            exit 1
          fi
          gh release create "$tag" release/* --target "${{ github.sha }}" --title "红果TV ${version}" --notes-file notes.md
