name: Sync README source snapshot

on:
  push:
    branches: [main, fix/hongguo-playback-20261015]
    paths:
      - README.md
      - .github/workflows/readme-sync.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check README and preserve source
        run: |
          python3 -c "from pathlib import Path; text = Path('README.md').read_text(encoding='utf-8'); assert text.startswith('# 红果TV'); assert '## 下载安装' in text; assert '## 应用内更新' in text"
          python3 scripts/finish_task.py --message "README 更新为面向使用者的版本说明"
          python3 scripts/sync_source.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: readme-source-snapshot
          path: ../真果·鉴-*.zip
          if-no-files-found: error
          retention-days: 14
