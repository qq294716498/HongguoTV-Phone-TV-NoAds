name: Publish existing HongguoTV 0.1.24 artifacts

on:
  push:
    branches: [release/publish-existing-0.1.24-49]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-existing-0.1.24-49
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SOURCE_COMMIT: 2843cabe4792f7734271f767727180dc7efcb0e3
      RELEASE_SOURCE_RUN: '39583037347'
      RELEASE_SOURCE_ROOT: ${{ github.workspace }}/source
      EXPECTED_UPDATE_TAG: app-v0.1.24-49
      EXPECTED_WINDOWS_TAG: windows-v0.1.24-49
      CHECK_LIVE_UPDATE: 'true'
      CHECK_UPDATE_DOWNLOAD: 'true'
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
        with:
          path: publisher
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 2843cabe4792f7734271f767727180dc7efcb0e3
          path: source
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Wait for the existing Android binary job only
        run: |
          for attempt in $(seq 1 120); do
            build_state=$(gh api "repos/qq294716498/HongguoTV-Phone-TV-NoAds/actions/runs/39583037347/jobs?per_page=100" --jq '.jobs[] | select(.name == "android") | .conclusion // .status')
            if [ "$build_state" = success ]; then exit 0; fi
            case "$build_state" in failure|cancelled|timed_out|skipped) echo "Existing Android build failed: $build_state" >&2; exit 1;; esac
            sleep 15
          done
          echo "Existing Android build did not finish in time" >&2
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: hongguotv-android-0.1.24+49
          run-id: 39583037347
          github-token: ${{ github.token }}
          path: source/dist/android
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Wait for matching Windows publication and isolation checks
        run: python3 ../publisher/scripts/publish_android_stable.py wait-windows
      - name: Stage signed immutable Android candidate and preserve Windows assets
        run: python3 ../publisher/scripts/publish_android_stable.py stage
      - name: Download staged APKs through the actual updater
        env:
          UPDATE_METADATA_FILE: staged-release.json
          CHECK_STAGED_UPDATE: 'true'
        run: flutter test --no-pub test/app_update_live_test.dart --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true --reporter=expanded
      - name: Verify downloaded APK certificates, versions, ABIs, assets and integrity
        run: |
          python3 scripts/verify_release_apks.py --directory dist/update-check --report staged-apk-validation.json
          cp dist/update-check/staged-apk-validation.json dist/android/
      - name: Promote only downloaded and signature-verified Android release
        run: python3 ../publisher/scripts/publish_android_stable.py promote
      - name: Verify public Latest downloads and channel isolation
        run: |
          for attempt in 1 2 3 4 5; do
            if flutter test --no-pub test/app_update_live_test.dart --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true --reporter=expanded; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Verify final public APK signatures again
        run: |
          python3 scripts/verify_release_apks.py --directory dist/update-check --report latest-apk-validation.json
          cp dist/update-check/latest-apk-validation.json dist/android/
      - name: Confirm Windows and previous Android assets unchanged and publish evidence
        run: python3 ../publisher/scripts/publish_android_stable.py finalize
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-existing-0.1.24-release-evidence
          path: |
            source/dist/android/*
            source/dist/update-check/*-update-check.json
          retention-days: 14
