name: macOS playback diagnostics
on:
  push:
    branches: ['diagnose/macos-*']
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-universal
          path: package
          run-id: 40631365690
          github-token: ${{ github.token }}
      - name: Validate Skia Metal across repeated launches
        run: |
          cd package
          ditto -x -k HongguoTV-*-macos-universal.zip extracted
          /usr/libexec/PlistBuddy -c 'Add :FLTEnableImpeller bool false' extracted/HongguoTV.app/Contents/Info.plist
          codesign --force --deep --sign - extracted/HongguoTV.app
          python3 - <<'PYCODE'
          import json, pathlib, subprocess
          root = pathlib.Path.cwd()
          for attempt in range(3):
              report = root / f'macOS-smoke-{attempt}.json'
              result = subprocess.run([str(root / 'extracted/HongguoTV.app/Contents/MacOS/HongguoTV'), '--package-smoke', str(report), str(root / 'synthetic.mp4')], timeout=120)
              if report.exists(): print(report.read_text(), flush=True)
              result.check_returncode()
              assert json.loads(report.read_text())['ok']
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-skia-${{ matrix.runner }}
          path: package/macOS-smoke-*.json
