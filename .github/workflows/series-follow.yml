name: Validate series browsing and follows

on:
  push:
    branches: [feature/series-follow-0.1.11]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: series-follow-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Format Dart source and report exact changes
        id: formatting
        continue-on-error: true
        run: |
          dart format lib test integration_test test_driver
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          for path in subprocess.check_output(['git', 'diff', '--name-only', '--', 'lib', 'test', 'integration_test', 'test_driver'], text=True).splitlines():
              print('FORMATTED_FILE_JSON=' + json.dumps({'path': path, 'content': Path(path).read_text()}, ensure_ascii=False))
          PY
          git diff --exit-code -- lib test integration_test test_driver
      - run: flutter analyze --no-pub --no-fatal-infos lib test integration_test test_driver
        id: analysis
        continue-on-error: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: flutter test --no-pub --dart-define=DISABLE_REMOTE_IMAGES=true --concurrency=2
        id: default_tests
        continue-on-error: true
      - run: flutter test --no-pub --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true --concurrency=2
        id: all_tests
        continue-on-error: true
      - run: go test -race ./...
        working-directory: native
      - run: go test -race -ldflags="-X duanjuapp/native/core.buildAllSources=true" ./...
        working-directory: native
      - name: Enforce checks
        if: always() && (steps.formatting.outcome != 'success' || steps.analysis.outcome != 'success' || steps.default_tests.outcome != 'success' || steps.all_tests.outcome != 'success')
        run: exit 1
      - name: Preserve clean source snapshot
        run: |
          python3 scripts/finish_task.py --message "新增全季选集并简化系列追剧，检查下季与最近观看进度"
          python3 scripts/sync_source.py --check
