name: Fix library UI performance and updater

on:
  push:
    branches: [fix/ui-lag-updater-0.1.12]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: series-follow-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Format Dart source and report exact changes
        id: formatting
        continue-on-error: true
        run: |
          dart format lib test integration_test test_driver
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          for path in subprocess.check_output(['git', 'diff', '--name-only', '--', 'lib', 'test', 'integration_test', 'test_driver'], text=True).splitlines():
              print('FORMATTED_FILE_JSON=' + json.dumps({'path': path, 'content': Path(path).read_text()}, ensure_ascii=False))
          PY
          git diff --exit-code -- lib test integration_test test_driver
      - run: flutter analyze --no-pub --no-fatal-infos lib test integration_test test_driver
        id: analysis
        continue-on-error: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Compare library performance with 0.1.11
        run: |
          set -euo pipefail
          cp lib/local_store.dart "$RUNNER_TEMP/final-local-store.dart"
          trap 'cp "$RUNNER_TEMP/final-local-store.dart" lib/local_store.dart' EXIT
          git fetch --depth=1 origin tag app-v0.1.11-35
          git show app-v0.1.11-35:lib/local_store.dart > lib/local_store.dart
          echo "BASELINE 0.1.11"
          flutter test --no-pub test/series_performance_test.dart --dart-define=DISABLE_REMOTE_IMAGES=true --reporter=expanded
          cp "$RUNNER_TEMP/final-local-store.dart" lib/local_store.dart
          echo "FIXED 0.1.12"
          flutter test --no-pub test/series_performance_test.dart --dart-define=DISABLE_REMOTE_IMAGES=true --reporter=expanded
      - run: flutter test --no-pub --dart-define=DISABLE_REMOTE_IMAGES=true --concurrency=2
        id: default_tests
        continue-on-error: true
      - run: flutter test --no-pub --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true --concurrency=2
        id: all_tests
        continue-on-error: true
      - run: go test -race ./...
        working-directory: native
      - run: go test -race -ldflags="-X duanjuapp/native/core.buildAllSources=true" ./...
        working-directory: native
      - name: Enforce checks
        if: always() && (steps.formatting.outcome != 'success' || steps.analysis.outcome != 'success' || steps.default_tests.outcome != 'success' || steps.all_tests.outcome != 'success')
        run: exit 1
      - name: Preserve clean source snapshot
        run: |
          python3 scripts/finish_task.py --message "修复系列列表重复计算、追剧检查刷新与更新安装状态"
          python3 scripts/sync_source.py --check

  android:
    needs: checks
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36"
          accept-android-sdk-licenses: true
      - run: sdkmanager 'ndk;28.2.13676358'
      - name: Configure Android signing
        id: signing
        run: |
          python scripts/configure_signing.py
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: python scripts/build_android.py --all-sources
      - name: Verify release identity, certificate, ABI and APK integrity
        run: python scripts/verify_release_apks.py
      - name: Remove signing files
        if: always()
        run: python scripts/configure_signing.py --clean
      - uses: actions/upload-artifact@v4
        with:
          name: hongguotv-android
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14
  release:
    needs: [checks, android]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_UPDATE_TAG: app-v0.1.12-36
      CHECK_LIVE_UPDATE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hongguotv-android
          path: dist/android
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Synchronize and archive exact checked source
        run: |
          python3 scripts/finish_task.py --message "Build 0.1.12 library performance and updater fixes"
          python3 scripts/sync_source.py --check
          cp ../真果·鉴-*.zip dist/android/HongguoTV-0.1.12-source.zip
          cd dist/android
          sha256sum *.apk *-source.zip APK-validation.json > SHA256SUMS.txt
      - name: Stage immutable release assets
        run: |
          set -euo pipefail
          if gh release view "$EXPECTED_UPDATE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; never replace published APKs." >&2
            exit 1
          fi
          cat > notes.md <<'NOTES'
          修复页面操作卡顿与应用内更新体验。
          
          - 优化追剧与列表操作流畅度。
          - 保留每次进入追剧检查下季及“查看全季”功能。
          - 下载、安装前重新确认当前版本，避免重复更新提示。
          - 加强安装包版本验证，改善下载进度显示。
          - 保留收藏、历史记录和备份数据。
          - Android 8.0+，手机 / TV 通用，沿用正式签名。
          - arm64-v8a：大多数手机；armeabi-v7a：32 位设备；x86_64：对应模拟器。
          - 自动化与更新下载验收通过后发布；真实手机 / TV 仍待实际使用验证。
          - 校验文件：SHA256SUMS.txt、APK-validation.json。
          NOTES
          printf '\n源码提交：%s\n' "${{ github.sha }}" >> notes.md
          gh release create "$EXPECTED_UPDATE_TAG" dist/android/* --target "${{ github.sha }}" --title "红果TV 0.1.12" --notes-file notes.md --prerelease --latest=false
          gh api "repos/${{ github.repository }}/releases/tags/$EXPECTED_UPDATE_TAG" > staged-release.json
      - name: Verify actual updater download and SHA-256 for all three ABIs
        env:
          UPDATE_METADATA_FILE: staged-release.json
          CHECK_STAGED_UPDATE: 'true'
          CHECK_UPDATE_DOWNLOAD: 'true'
        run: flutter test --no-pub test/app_update_live_test.dart --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true --reporter=expanded
      - name: Promote verified release to latest stable
        run: gh release edit "$EXPECTED_UPDATE_TAG" --prerelease=false --latest
      - name: Verify public latest API used by installed applications
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if flutter test --no-pub test/app_update_live_test.dart --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true --reporter=expanded; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Attach update validation reports
        run: gh release upload "$EXPECTED_UPDATE_TAG" dist/update-check/*-update-check.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hongguotv-update-verification
          path: |
            dist/update-check/*-update-check.json
            dist/android/*-source.zip
          if-no-files-found: warn
