name: Hongguo playback diagnosis

on:
  push:
    branches: [fix/hongguo-playback-20261015]
  workflow_dispatch:
    inputs:
      guest_registration:
        description: Run the limited live guest registration comparison
        type: boolean
        default: false
      fixed_playback:
        description: Verify the normal production playback resolver
        type: boolean
        default: false
      protocol_probe:
        description: Run the limited APK routing and request comparison
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hongguo-playback-diagnosis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - name: Go formatting
        working-directory: native
        run: |
          gofmt -d core/models.go core/provider_hongguo*.go
          test -z "$(gofmt -l core/models.go core/provider_hongguo*.go)"
      - name: Go regression tests
        working-directory: native
        run: |
          go test -race ./...
          go test -race -ldflags="-X duanjuapp/native/core.buildAllSources=true" ./...
      - name: Preserve source snapshot
        run: |
          python3 scripts/finish_task.py --message "修正播放模型接口的旧签名头并保留内容类型传递；取址与实机播放分别验证"
          python3 scripts/sync_source.py --check
      - name: Live guest registration without media or images
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.guest_registration }}
        working-directory: native
        env:
          CHECK_LIVE_HONGGUO_REGISTRATION: "true"
        run: go test ./core -run '^TestLiveHongguoGuestRegistration$' -v -count=1
      - name: Live APK protocol comparison without media or images
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.protocol_probe) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[probe-protocol]')) }}
        working-directory: native
        env:
          CHECK_LIVE_HONGGUO_PROTOCOL: "true"
        run: go test ./core -run '^TestLiveHongguoSignatureControl$' -v -count=1
      - name: Live production resolver and 64-byte MP4 header without images
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.fixed_playback) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-playback]')) }}
        working-directory: native
        env:
          CHECK_LIVE_HONGGUO_FIXED: "true"
        run: go test ./core -run '^TestLiveHongguoFixedPlayback$' -v -count=1
