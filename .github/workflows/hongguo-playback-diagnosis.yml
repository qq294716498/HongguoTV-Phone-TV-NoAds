name: Hongguo playback diagnosis

on:
  push:
    branches: [fix/hongguo-playback-20261015]
  workflow_dispatch:
    inputs:
      guest_registration:
        description: Run the limited live guest registration comparison
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hongguo-playback-diagnosis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - name: Go formatting
        working-directory: native
        run: |
          gofmt -d core/models.go core/provider_hongguo*.go
          test -z "$(gofmt -l core/models.go core/provider_hongguo*.go)"
      - name: Go regression tests
        working-directory: native
        run: |
          go test -race ./...
          go test -race -ldflags="-X duanjuapp/native/core.buildAllSources=true" ./...
      - name: Preserve source snapshot
        run: |
          python3 scripts/finish_task.py --message "访客注册成功但取址仍为空，保留诊断与验证记录"
          python3 scripts/sync_source.py --check
      - name: Live guest registration without media or images
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.guest_registration }}
        working-directory: native
        env:
          CHECK_LIVE_HONGGUO_REGISTRATION: "true"
        run: go test ./core -run '^TestLiveHongguoGuestRegistration$' -v -count=1
