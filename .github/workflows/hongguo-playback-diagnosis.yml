name: Hongguo playback diagnosis

on:
  push:
    branches: [fix/hongguo-playback-20261015]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hongguo-playback-diagnosis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - name: Go formatting
        working-directory: native
        run: test -z "$(gofmt -l core/provider_hongguo_probe_test.go)"
      - name: Go regression tests
        working-directory: native
        run: go test -race ./...
      - name: Preserve source snapshot
        run: |
          python3 scripts/finish_task.py --message "新增红果取址复现诊断，确认三路取址失败；尚未恢复播放"
          python3 scripts/sync_source.py --check
      - name: Live address resolution without media or images
        if: github.event_name == 'workflow_dispatch'
        working-directory: native
        env:
          CHECK_LIVE_HONGGUO: "true"
        run: go test ./core -run '^TestLiveHongguoPlaybackResolution$' -v -count=1
