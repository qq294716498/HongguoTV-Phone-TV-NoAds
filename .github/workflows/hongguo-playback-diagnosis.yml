name: Hongguo playback diagnosis

on:
  push:
    branches: [fix/hongguo-playback-20261015]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hongguo-playback-diagnosis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - name: Go formatting
        working-directory: native
        run: |
          gofmt -d core/models.go core/provider_hongguo*.go
          test -z "$(gofmt -l core/models.go core/provider_hongguo*.go)"
      - name: Go regression tests
        working-directory: native
        run: |
          go test -race ./...
          go test -race -ldflags="-X duanjuapp/native/core.buildAllSources=true" ./...
      - name: Preserve source snapshot
        run: |
          python3 scripts/finish_task.py --message "保留官方剧集内容类型并修正空响应诊断；真实取址仍失败，未恢复播放"
          python3 scripts/sync_source.py --check
      - name: Live address resolution without media or images
        working-directory: native
        env:
          CHECK_LIVE_HONGGUO: "true"
        run: go test ./core -run '^TestLiveHongguoPlaybackResolution$' -v -count=1
