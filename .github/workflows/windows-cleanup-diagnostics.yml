name: Audit Android release finalization
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  checks: write
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-0.1.52-reused-package-evidence
          run-id: 43341696721
          github-token: ${{ github.token }}
          path: dist/android
      - name: Inspect recorded release evidence
        run: |
          python3 - <<'PY'
          import os,sys,json
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import publish_android_stable as p
          try:
              d=Path('dist/android')
              print('EVIDENCE_FILES', sorted(x.name for x in d.iterdir()))
              before=p.read('Release-before.json')
              windows={name:p.snapshot(p.release(name)) for name in p.windows_tags}
              print('WINDOWS_UNCHANGED',windows==before['windows'])
              print('PREVIOUS_ANDROID_UNCHANGED',p.snapshot(p.release(before['android']['tag']))==before['android'])
              for k in ['staged-apk-validation.json','latest-apk-validation.json','staged-update-check.json','latest-update-check.json']:
                  print('EVIDENCE_'+k, (d/k).exists())
              if windows!=before['windows'] or p.snapshot(p.release(before['android']['tag']))!=before['android']: raise ValueError('release snapshots changed')
              print('::notice title=Release evidence::Previous Android and Windows release snapshots are unchanged')
          except Exception as e:
              print('::error title=Release audit::'+type(e).__name__+' '+str(e).replace('%','%25').replace('\n','%0A'))
              raise
          PY
